<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>とりにっき</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #fdf8f0;
    --card: #fff;
    --accent: #e8a87c;
    --accent2: #7ec8b0;
    --text: #3a2f2f;
    --sub: #9e8e8e;
    --border: #f0e8df;
    --nav-h: 64px;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', sans-serif; max-width: 480px; margin: 0 auto; min-height: 100vh; }

  nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: var(--nav-h); background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 100; box-shadow: 0 -2px 12px rgba(0,0,0,.06); }
  nav button { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; color: var(--sub); cursor: pointer; transition: color .2s; padding: 8px 0; }
  nav button.active { color: var(--accent); }
  nav button svg { width: 24px; height: 24px; }

  main { padding: 0 0 calc(var(--nav-h) + 8px); min-height: 100vh; }
  .page { display: none; padding: 0 16px 16px; }
  .page.active { display: block; }

  .header { padding: 20px 0 8px; }
  .header h1 { font-size: 26px; font-weight: 700; font-family: 'Zen Maru Gothic', sans-serif; color: var(--accent); letter-spacing: 2px; display: inline-block; background: rgba(255,255,255,0.92); padding: 4px 18px; border-radius: 20px; border: 2px solid #fff; box-shadow: 0 2px 10px rgba(232,168,124,.18); }
  .header .date { font-size: 13px; color: var(--sub); margin-top: 6px; }
  .date-nav { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .date-nav button { background: var(--card); border: 1px solid var(--border); border-radius: 8px; width: 30px; height: 30px; font-size: 16px; cursor: pointer; color: var(--sub); display: flex; align-items: center; justify-content: center; line-height: 1; }
  .date-nav button:disabled { opacity: .3; cursor: default; }
  .date-nav .nav-date { font-size: 13px; color: var(--sub); flex: 1; text-align: center; }

  .section-title { font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: .5px; margin: 16px 0 10px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05); margin-bottom: 12px; }

  /* Bird tabs */
  .bird-tabs { display: flex; gap: 8px; margin: 8px 0 14px; }
  .bird-tab { flex: 1; padding: 10px 6px; border: 2px solid var(--border); background: var(--card); border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--sub); transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .bird-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .edit-btn { font-size: 13px; background: none; border: none; cursor: pointer; padding: 2px 4px; opacity: .65; color: inherit; }

  /* Wide photo (today's one shot) */
  .photo-label-wide {
    display: block; background: var(--bg); border: 2px dashed var(--border);
    border-radius: 12px; width: 100%; aspect-ratio: 4/3;
    position: relative; overflow: hidden; cursor: pointer;
    transition: border-color .2s; -webkit-tap-highlight-color: transparent;
  }
  .photo-label-wide:active { border-color: var(--accent); }
  .photo-label-wide img.preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
  .photo-label-wide .ph-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; color: var(--sub); }
  .photo-label-wide.has-photo .ph-inner { background: none; justify-content: flex-end; padding-bottom: 10px; }
  .photo-label-wide.has-photo .ph-inner svg { display: none; }
  .photo-label-wide.has-photo .ph-inner span {
    background: rgba(0,0,0,.38); color: #fff; padding: 3px 12px;
    border-radius: 12px; font-size: 11px; backdrop-filter: blur(2px);
  }
  .photo-label-wide input[type=file] { display: none; }

  /* Big number input */
  .num-row { display: flex; align-items: baseline; gap: 8px; padding: 8px 0 4px; }
  .big-input {
    font-size: 44px; font-weight: 700; border: none; background: none;
    width: 150px; outline: none; color: var(--text);
    border-bottom: 3px solid var(--border); padding: 2px 0;
    -webkit-appearance: none; appearance: none;
  }
  .big-input:focus { border-bottom-color: var(--accent); }
  .big-unit { font-size: 16px; color: var(--sub); font-weight: 500; }

  /* Food 2-col */
  .food-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .food-col .food-label { font-size: 12px; color: var(--sub); margin-bottom: 2px; }
  .food-col .big-input { font-size: 36px; width: 110px; }

  .calc-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: linear-gradient(135deg, #e8f8f3, #d4f0e8); border-radius: 12px; margin-top: 14px; }
  .calc-row .label { font-size: 13px; color: var(--text); }
  .calc-row .value { font-size: 24px; font-weight: 700; color: var(--accent2); }

  .save-btn { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px; transition: opacity .2s; }
  .save-btn:disabled { opacity: .4; cursor: default; }

  .today-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { background: var(--card); border-radius: 14px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .stat-card .s-label { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
  .stat-card .s-val { font-size: 24px; font-weight: 700; }
  .stat-card .s-unit { font-size: 12px; color: var(--sub); }
  .today-photo-thumb { width: 100%; border-radius: 10px; margin-top: 10px; max-height: 160px; object-fit: cover; display: none; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-60px); background: #3a2f2f; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 999; transition: transform .3s ease; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Album */
  .month-group { margin-bottom: 24px; }
  .month-label { font-size: 14px; font-weight: 600; color: var(--sub); margin-bottom: 10px; }
  .album-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .album-thumb { aspect-ratio: 1; border-radius: 8px; overflow: hidden; cursor: pointer; position: relative; background: var(--border); }
  .album-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .album-thumb .thumb-date { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.55)); padding: 10px 4px 4px; font-size: 10px; color: #fff; text-align: center; }
  .album-empty { text-align: center; padding: 60px 20px; color: var(--sub); }
  .album-empty svg { width: 64px; height: 64px; opacity: .3; margin-bottom: 12px; }

  .modal { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.88); align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
  .modal.open { display: flex; }
  .modal img { max-width: 100%; max-height: 72vh; border-radius: 12px; object-fit: contain; }
  .modal-info { color: #fff; margin-top: 12px; text-align: center; }
  .modal-info .mi-date { font-size: 16px; font-weight: 600; }
  .modal-info .mi-stats { font-size: 13px; color: rgba(255,255,255,.7); margin-top: 4px; }
  .modal-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,.15); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .chart-card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05); margin-bottom: 16px; }
  .chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--sub); }
  .chart-wrap { position: relative; height: 180px; }
  .range-btns { display: flex; gap: 6px; margin-bottom: 14px; }
  .range-btns button { flex: 1; padding: 8px; border: 1px solid var(--border); background: var(--card); border-radius: 10px; font-size: 13px; cursor: pointer; color: var(--sub); }
  .range-btns button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .record-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .record-item:last-child { border-bottom: none; }
  .record-item .ri-thumb { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: var(--border); flex-shrink: 0; }
  .record-item .ri-info .ri-date { font-size: 13px; font-weight: 600; }
  .record-item .ri-info .ri-stats { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .record-item .ri-del { margin-left: auto; background: none; border: none; cursor: pointer; color: #ccc; font-size: 20px; padding: 4px 8px; line-height: 1; }
  .no-data { text-align: center; padding: 40px; color: var(--sub); font-size: 14px; }

  /* Comment */
  .comment-input { width: 100%; border: none; background: none; resize: none; font-size: 15px; color: var(--text); outline: none; font-family: inherit; line-height: 1.7; }
  .comment-input::placeholder { color: var(--sub); }
  .comment-display { font-size: 14px; color: var(--text); line-height: 1.6; margin-top: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <!-- TODAY PAGE -->
  <div id="page-today" class="page active">
    <div class="header">
      <h1>とりにっき</h1>
      <div class="date-nav">
        <button onclick="changeDay(-1)" id="prev-day-btn">&#8592;</button>
        <div class="nav-date" id="today-date"></div>
        <button onclick="changeDay(1)" id="next-day-btn" disabled>&#8594;</button>
      </div>
    </div>

    <!-- Bird tabs -->
    <div class="bird-tabs">
      <button class="bird-tab active" id="tab-bird-0" onclick="switchBird(0)">
        <span id="name-bird-0">文鳥1</span>
        <button class="edit-btn" onclick="event.stopPropagation(); renameBird(0)" title="名前を変更">✏</button>
      </button>
      <button class="bird-tab" id="tab-bird-1" onclick="switchBird(1)">
        <span id="name-bird-1">文鳥2</span>
        <button class="edit-btn" onclick="event.stopPropagation(); renameBird(1)" title="名前を変更">✏</button>
      </button>
    </div>

    <!-- Today saved summary -->
    <div id="today-saved" style="display:none; margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;" id="saved-date-label">今日の記録</div>
      <div class="today-summary">
        <div class="stat-card">
          <div class="s-label">体重</div>
          <div><span class="s-val" id="sum-weight">—</span> <span class="s-unit">g</span></div>
        </div>
        <div class="stat-card">
          <div class="s-label">食べた量</div>
          <div><span class="s-val" id="sum-food">—</span> <span class="s-unit">g</span></div>
        </div>
      </div>
      <img id="sum-photo" class="today-photo-thumb" src="" alt="">
      <div id="sum-comment" style="display:none; margin-top:8px; background:var(--card); border-radius:14px; padding:12px 14px; box-shadow:0 2px 8px rgba(0,0,0,.04);">
        <div style="font-size:11px;color:var(--sub);margin-bottom:4px;">一言メモ</div>
        <div class="comment-display" id="sum-comment-text"></div>
      </div>
      <div style="margin-top:8px; background:var(--card); border-radius:14px; padding:12px 14px; font-size:13px; color:var(--sub); box-shadow:0 2px 8px rgba(0,0,0,.04);">
        記録済みです。下のフォームから上書き保存できます。
      </div>
    </div>

    <!-- Today's one shot -->
    <div class="card">
      <div class="section-title" style="margin-top:0;">今日の一枚</div>
      <label class="photo-label-wide" id="shot-btn" for="shot-input">
        <img class="preview" id="shot-preview" src="" style="display:none;">
        <div class="ph-inner" id="shot-inner">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span>文鳥の写真を撮る</span>
        </div>
        <input type="file" accept="image/*" id="shot-input" onchange="handleShotPhoto(this)">
      </label>
    </div>

    <!-- Weight -->
    <div class="card">
      <div class="section-title" style="margin-top:0;">体重</div>
      <div class="num-row">
        <input class="big-input" type="number" step="0.1" inputmode="decimal" placeholder="—" id="weight-val" oninput="onNumInput('weight', this.value)">
        <span class="big-unit">g</span>
      </div>
    </div>

    <!-- Food -->
    <div class="card">
      <div class="section-title" style="margin-top:0;">餌の記録</div>
      <div class="food-grid">
        <div class="food-col">
          <div class="food-label">与えた量</div>
          <div class="num-row">
            <input class="big-input" type="number" step="0.1" inputmode="decimal" placeholder="—" id="food-before-val" oninput="onNumInput('food-before', this.value)">
            <span class="big-unit">g</span>
          </div>
        </div>
        <div class="food-col">
          <div class="food-label">残った量</div>
          <div class="num-row">
            <input class="big-input" type="number" step="0.1" inputmode="decimal" placeholder="—" id="food-after-val" oninput="onNumInput('food-after', this.value)">
            <span class="big-unit">g</span>
          </div>
        </div>
      </div>
      <div class="calc-row" id="food-calc" style="display:none;">
        <div class="label">食べた量（計算）</div>
        <div><span class="value" id="food-eaten-val">—</span> <span style="font-size:13px;color:var(--sub);">g</span></div>
      </div>
    </div>

    <!-- Comment -->
    <div class="card">
      <div class="section-title" style="margin-top:0;">一言メモ</div>
      <textarea class="comment-input" id="comment-val" rows="3" placeholder="今日の様子、気づいたことなど…" oninput="onCommentInput(this.value)"></textarea>
    </div>

    <button class="save-btn" id="save-btn" onclick="saveRecord()" disabled>記録を保存する</button>
  </div>

  <!-- ALBUM PAGE -->
  <div id="page-album" class="page">
    <div class="header"><h1>アルバム</h1></div>
    <div class="bird-tabs">
      <button class="bird-tab active" id="album-tab-0" onclick="switchAlbumBird(0)"><span id="album-name-0">文鳥1</span></button>
      <button class="bird-tab" id="album-tab-1" onclick="switchAlbumBird(1)"><span id="album-name-1">文鳥2</span></button>
    </div>
    <div id="album-content"></div>
  </div>

  <!-- GRAPH PAGE -->
  <div id="page-graph" class="page">
    <div class="header"><h1>グラフ</h1></div>
    <div class="bird-tabs">
      <button class="bird-tab active" id="graph-tab-0" onclick="switchGraphBird(0)"><span id="graph-name-0">文鳥1</span></button>
      <button class="bird-tab" id="graph-tab-1" onclick="switchGraphBird(1)"><span id="graph-name-1">文鳥2</span></button>
    </div>
    <div class="range-btns">
      <button class="active" onclick="setRange(7, this)">7日間</button>
      <button onclick="setRange(14, this)">2週間</button>
      <button onclick="setRange(30, this)">1ヶ月</button>
    </div>
    <div class="chart-card">
      <h3>体重 (g)</h3>
      <div class="chart-wrap"><canvas id="weight-chart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>食べた量 (g)</h3>
      <div class="chart-wrap"><canvas id="food-chart"></canvas></div>
    </div>
  </div>

  <!-- RECORDS PAGE -->
  <div id="page-records" class="page">
    <div class="header"><h1>記録一覧</h1></div>
    <div class="bird-tabs">
      <button class="bird-tab active" id="rec-tab-0" onclick="switchRecBird(0)"><span id="rec-name-0">文鳥1</span></button>
      <button class="bird-tab" id="rec-tab-1" onclick="switchRecBird(1)"><span id="rec-name-1">文鳥2</span></button>
    </div>
    <div id="records-list"></div>
  </div>
</main>

<nav>
  <button class="active" onclick="switchPage('today', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M12 14c-5 0-7 2-7 4v1h14v-1c0-2-2-4-7-4z"/></svg>
    今日
  </button>
  <button onclick="switchPage('album', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>
    アルバム
  </button>
  <button onclick="switchPage('graph', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    グラフ
  </button>
  <button onclick="switchPage('records', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    一覧
  </button>
</nav>

<div class="modal" id="photo-modal" onclick="closeModal()">
  <button class="modal-close" onclick="closeModal()">&#x2715;</button>
  <img id="modal-img" src="" alt="">
  <div class="modal-info">
    <div class="mi-date" id="modal-date"></div>
    <div class="mi-stats" id="modal-stats"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== State =====
let activeBird = 0;
let albumBird = 0;
let graphBird = 0;
let recBird = 0;
let state = { weight: null, foodBefore: null, foodAfter: null, todayPhoto: null, comment: '' };
let chartRange = 7;
let weightChart = null, foodChart = null;
let selectedDate = null; // set in DOMContentLoaded

// ===== Bird names =====
function getBirdNames() {
  try { return JSON.parse(localStorage.getItem('tori_bird_names') || '["文鳥1","文鳥2"]'); } catch(e) { return ['文鳥1', '文鳥2']; }
}
function saveBirdNames(names) { localStorage.setItem('tori_bird_names', JSON.stringify(names)); }

function updateBirdNameUI() {
  const names = getBirdNames();
  [0, 1].forEach(i => {
    [['name-bird-', 'tab-bird-'], ['album-name-', 'album-tab-'], ['graph-name-', 'graph-tab-'], ['rec-name-', 'rec-tab-']].forEach(([nameId, tabId]) => {
      const el = document.getElementById(nameId + i);
      if (el) el.textContent = names[i];
    });
  });
}

function renameBird(idx) {
  const names = getBirdNames();
  const newName = prompt((idx === 0 ? '1羽目' : '2羽目') + 'の名前を入力してください', names[idx]);
  if (newName && newName.trim()) {
    names[idx] = newName.trim();
    saveBirdNames(names);
    updateBirdNameUI();
  }
}

// ===== Storage: localStorage + 自動容量管理 =====
async function getRecords(birdIdx) {
  const idx = birdIdx !== undefined ? birdIdx : activeBird;
  try { return JSON.parse(localStorage.getItem('tori_records_' + idx) || '{}'); } catch(e) { return {}; }
}

async function saveRecords(records, birdIdx) {
  const idx = birdIdx !== undefined ? birdIdx : activeBird;
  // 1回目：そのまま保存
  try {
    localStorage.setItem('tori_records_' + idx, JSON.stringify(records));
    return true;
  } catch(e) {}
  // 失敗→古い写真を削除して容量確保してから再試行
  freeOldPhotos();
  try {
    localStorage.setItem('tori_records_' + idx, JSON.stringify(records));
    return true;
  } catch(e) { return false; }
}

function freeOldPhotos() {
  // 両方の文鳥の古い写真を削除（直近7日分は残す）
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 7);
  for (let i = 0; i <= 1; i++) {
    try {
      const rec = JSON.parse(localStorage.getItem('tori_records_' + i) || '{}');
      let changed = false;
      Object.keys(rec).forEach(k => {
        if (rec[k] && rec[k].todayPhoto) {
          const d = new Date(k.replace(/-/g, '/'));
          if (d < cutoff) { delete rec[k].todayPhoto; changed = true; }
        }
      });
      if (changed) localStorage.setItem('tori_records_' + i, JSON.stringify(rec));
    } catch(e) {}
  }
}

// ===== Init =====
document.addEventListener('DOMContentLoaded', async () => {
  // 旧形式データの移行（tori_records → tori_records_0）
  if (localStorage.getItem('tori_records') && !localStorage.getItem('tori_records_0')) {
    localStorage.setItem('tori_records_0', localStorage.getItem('tori_records'));
  }
  selectedDate = todayKey();
  updateDateHeader();
  updateBirdNameUI();
  await checkTodaySaved();
});

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function dateKeyToDisplay(key) {
  const [y, m, d] = key.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  return date.toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
}

function updateDateHeader() {
  document.getElementById('today-date').textContent = dateKeyToDisplay(selectedDate);
  const isToday = selectedDate === todayKey();
  document.getElementById('next-day-btn').disabled = isToday;
  document.getElementById('save-btn').textContent = isToday ? '記録を保存する' : 'この日の記録を保存する';
}

async function changeDay(delta) {
  const [y, m, d] = selectedDate.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  date.setDate(date.getDate() + delta);
  const newKey = date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
  if (newKey > todayKey()) return;
  selectedDate = newKey;
  updateDateHeader();
  resetForm();
  await checkTodaySaved();
}

function resetForm() {
  state = { weight: null, foodBefore: null, foodAfter: null, todayPhoto: null, comment: '' };
  document.getElementById('weight-val').value = '';
  document.getElementById('food-before-val').value = '';
  document.getElementById('food-after-val').value = '';
  document.getElementById('food-calc').style.display = 'none';
  document.getElementById('comment-val').value = '';
  const si = document.getElementById('shot-input');
  si.value = '';
  if (si.value) { si.type = 'text'; si.type = 'file'; }
  const sp = document.getElementById('shot-preview');
  sp.src = ''; sp.style.display = 'none';
  document.getElementById('shot-btn').classList.remove('has-photo');
  document.getElementById('shot-inner').querySelector('span').textContent = '文鳥の写真を撮る';
  updateSaveBtn();
}

// ===== Bird switching =====
async function switchBird(idx) {
  activeBird = idx;
  [0, 1].forEach(i => document.getElementById('tab-bird-' + i).classList.toggle('active', i === idx));
  resetForm();
  await checkTodaySaved();
}

async function switchAlbumBird(idx) {
  albumBird = idx;
  [0, 1].forEach(i => document.getElementById('album-tab-' + i).classList.toggle('active', i === idx));
  await renderAlbum();
}

async function switchGraphBird(idx) {
  graphBird = idx;
  [0, 1].forEach(i => document.getElementById('graph-tab-' + i).classList.toggle('active', i === idx));
  await renderGraphs();
}

async function switchRecBird(idx) {
  recBird = idx;
  [0, 1].forEach(i => document.getElementById('rec-tab-' + i).classList.toggle('active', i === idx));
  await renderRecords();
}

// ===== Page switching =====
async function switchPage(page, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  btn.classList.add('active');
  if (page === 'album') await renderAlbum();
  if (page === 'graph') await renderGraphs();
  if (page === 'records') await renderRecords();
}

// ===== Today summary =====
async function checkTodaySaved() {
  const r = (await getRecords())[selectedDate];
  const el = document.getElementById('today-saved');
  if (r) {
    el.style.display = 'block';
    const isToday = selectedDate === todayKey();
    document.getElementById('saved-date-label').textContent = isToday ? '今日の記録' : dateKeyToDisplay(selectedDate) + ' の記録';
    document.getElementById('sum-weight').textContent = r.weight ?? '—';
    document.getElementById('sum-food').textContent = r.foodEaten ?? '—';
    const ph = document.getElementById('sum-photo');
    if (r.todayPhoto) { ph.src = r.todayPhoto; ph.style.display = 'block'; }
    else { ph.style.display = 'none'; }
    const sc = document.getElementById('sum-comment');
    if (r.comment) { document.getElementById('sum-comment-text').textContent = r.comment; sc.style.display = 'block'; }
    else { sc.style.display = 'none'; }
    // Restore state and form so overwrite works
    state = { weight: r.weight ?? null, foodBefore: r.foodBefore ?? null, foodAfter: r.foodAfter ?? null, todayPhoto: r.todayPhoto ?? null, comment: r.comment || '' };
    if (r.weight != null) document.getElementById('weight-val').value = r.weight;
    if (r.foodBefore != null) document.getElementById('food-before-val').value = r.foodBefore;
    if (r.foodAfter != null) document.getElementById('food-after-val').value = r.foodAfter;
    if (r.comment) document.getElementById('comment-val').value = r.comment;
    const sp = document.getElementById('shot-preview');
    if (r.todayPhoto) {
      sp.src = r.todayPhoto; sp.style.display = 'block';
      document.getElementById('shot-btn').classList.add('has-photo');
      document.getElementById('shot-inner').querySelector('span').textContent = '撮り直す';
    } else {
      sp.src = ''; sp.style.display = 'none';
      document.getElementById('shot-btn').classList.remove('has-photo');
      document.getElementById('shot-inner').querySelector('span').textContent = '文鳥の写真を撮る';
    }
    updateFoodCalc();
    updateSaveBtn();
  } else {
    el.style.display = 'none';
  }
}

// ===== Today's one shot =====
function handleShotPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  fileToDataUrl(file).then(dataUrl => {
    // プレビュー用：大きいサイズで表示（保存はしない）
    compressImage(dataUrl, 1024, 0.75).then(previewUrl => {
      const img = document.getElementById('shot-preview');
      img.src = previewUrl; img.style.display = 'block';
      document.getElementById('shot-btn').classList.add('has-photo');
      document.getElementById('shot-inner').querySelector('span').textContent = '撮り直す';
    });
    // 保存用：超小さいサムネイル（約10〜15KB）で長期保存
    compressImage(dataUrl, 300, 0.65).then(thumbUrl => {
      state.todayPhoto = thumbUrl;
      updateSaveBtn();
    });
  });
}

function fileToDataUrl(file) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.readAsDataURL(file);
  });
}

// Compress image to specified max size and quality
function compressImage(dataUrl, maxSize, quality) {
  const max = maxSize || 1024;
  const q = quality || 0.75;
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', q));
      } catch(e) {
        resolve(dataUrl);
      }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// ===== Comment input =====
function onCommentInput(val) {
  state.comment = val;
  updateSaveBtn();
}

// ===== Number input =====
function onNumInput(type, val) {
  const num = parseFloat(val);
  const v = isNaN(num) ? null : num;
  if (type === 'weight') state.weight = v;
  else if (type === 'food-before') state.foodBefore = v;
  else state.foodAfter = v;
  updateFoodCalc();
  updateSaveBtn();
}

// ===== Food calc =====
function updateFoodCalc() {
  const b = state.foodBefore, a = state.foodAfter;
  const calc = document.getElementById('food-calc');
  if (b !== null && a !== null) {
    const eaten = Math.max(0, Math.round((b - a) * 10) / 10);
    document.getElementById('food-eaten-val').textContent = eaten;
    calc.style.display = 'flex';
  } else {
    calc.style.display = 'none';
  }
}

function getEaten() {
  const b = state.foodBefore, a = state.foodAfter;
  if (b === null || a === null) return null;
  return Math.max(0, Math.round((b - a) * 10) / 10);
}

// ===== Save button =====
function updateSaveBtn() {
  const hasWeight  = document.getElementById('weight-val').value.trim() !== '';
  const hasFoodB   = document.getElementById('food-before-val').value.trim() !== '';
  const hasFoodA   = document.getElementById('food-after-val').value.trim() !== '';
  const hasPhoto   = document.getElementById('shot-preview').style.display !== 'none';
  const hasComment = document.getElementById('comment-val').value.trim() !== '';
  document.getElementById('save-btn').disabled =
    !(hasWeight || hasFoodB || hasFoodA || hasPhoto || hasComment);
}

// ===== Save =====
async function saveRecord() {
  try {
    const key = selectedDate;
    // 保険：state.todayPhotoがnullでもプレビューに写真があれば使う
    if (!state.todayPhoto) {
      const sp = document.getElementById('shot-preview');
      if (sp.style.display !== 'none' && sp.src && sp.src.startsWith('data:')) {
        state.todayPhoto = sp.src;
      }
    }
    const records = await getRecords();
    records[key] = {
      date: key,
      weight: state.weight,
      foodBefore: state.foodBefore,
      foodAfter: state.foodAfter,
      foodEaten: getEaten(),
      todayPhoto: state.todayPhoto,
      comment: state.comment || '',
      savedAt: new Date().toISOString(),
    };

    if (await saveRecords(records)) {
      showToast('保存しました！');
    } else {
      showToast('保存できませんでした');
      return;
    }

    await checkTodaySaved();
    const saved = records[key];
    state = { weight: saved.weight, foodBefore: saved.foodBefore, foodAfter: saved.foodAfter, todayPhoto: saved.todayPhoto, comment: saved.comment || '' };
    updateSaveBtn();
  } catch(e) {
    showToast('エラーが発生しました: ' + (e && e.message ? e.message : String(e)));
  }
}

async function recompressSmall(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        const max = 512;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.5));
      } catch(e) { resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// ===== Album =====
async function renderAlbum() {
  const records = await getRecords(albumBird);
  const keys = Object.keys(records).filter(k => records[k].todayPhoto).sort().reverse();
  const container = document.getElementById('album-content');
  if (keys.length === 0) {
    const name = getBirdNames()[albumBird];
    container.innerHTML =
      '<div class="album-empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>' +
      '<div>まだ写真がありません</div>' +
      '<div style="font-size:12px;margin-top:6px;">' + name + 'の「今日の一枚」を撮ってね</div></div>';
    return;
  }
  const months = {};
  keys.forEach(k => { const m = k.slice(0,7); if (!months[m]) months[m]=[]; months[m].push(k); });
  let html = '';
  Object.keys(months).sort().reverse().forEach(m => {
    const [y, mo] = m.split('-');
    html += '<div class="month-group"><div class="month-label">' + y + '年' + parseInt(mo) + '月</div><div class="album-grid">';
    months[m].forEach(k => {
      const d = k.split('-');
      html += '<div class="album-thumb" onclick="openModal(\'' + k + '\')">' +
        '<img src="' + records[k].todayPhoto + '" loading="lazy">' +
        '<div class="thumb-date">' + parseInt(d[1]) + '/' + parseInt(d[2]) + '</div></div>';
    });
    html += '</div></div>';
  });
  container.innerHTML = html;
}

async function openModal(key) {
  const r = (await getRecords(albumBird))[key];
  if (!r) return;
  document.getElementById('modal-img').src = r.todayPhoto || '';
  const d = key.split('-');
  document.getElementById('modal-date').textContent = d[0] + '年' + parseInt(d[1]) + '月' + parseInt(d[2]) + '日';
  const stats = [];
  if (r.weight != null) stats.push('体重 ' + r.weight + 'g');
  if (r.foodEaten != null) stats.push('食べた ' + r.foodEaten + 'g');
  document.getElementById('modal-stats').textContent = stats.join('　');
  document.getElementById('photo-modal').classList.add('open');
}

function closeModal() { document.getElementById('photo-modal').classList.remove('open'); }

// ===== Graph =====
async function setRange(days, btn) {
  chartRange = days;
  document.querySelectorAll('.range-btns button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  await renderGraphs();
}

async function renderGraphs() {
  const records = await getRecords(graphBird);
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - chartRange + 1);
  const keys = Object.keys(records).sort().filter(k => new Date(k) >= cutoff);
  const labels = keys.map(k => { const d=k.split('-'); return parseInt(d[1])+'/'+parseInt(d[2]); });
  if (weightChart) weightChart.destroy();
  if (foodChart) foodChart.destroy();
  weightChart = makeChart('weight-chart', labels, keys.map(k => records[k].weight), '#e8a87c');
  foodChart = makeChart('food-chart', labels, keys.map(k => records[k].foodEaten), '#7ec8b0');
}

function makeChart(id, labels, data, color) {
  return new Chart(document.getElementById(id).getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [{ data, borderColor: color, backgroundColor: color+'33', fill: true, tension: 0.4, pointRadius: 5, pointBackgroundColor: color, spanGaps: false }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { grid: { display: false }, ticks: { font: { size: 11 } } }, y: { grid: { color: '#f0e8df' }, ticks: { font: { size: 11 } } } } }
  });
}

// ===== Records =====
async function renderRecords() {
  const records = await getRecords(recBird);
  const keys = Object.keys(records).sort().reverse();
  const container = document.getElementById('records-list');
  if (keys.length === 0) { container.innerHTML = '<div class="no-data">まだ記録がありません</div>'; return; }
  let html = '';
  keys.forEach(k => {
    const r = records[k];
    const d = k.split('-');
    const stats = [];
    if (r.weight != null) stats.push('体重 ' + r.weight + 'g');
    if (r.foodEaten != null) stats.push('食べた ' + r.foodEaten + 'g');
    html += '<div class="record-item">' +
      (r.todayPhoto ? '<img class="ri-thumb" src="' + r.todayPhoto + '">' : '<div class="ri-thumb"></div>') +
      '<div class="ri-info"><div class="ri-date">' + d[0] + '年' + parseInt(d[1]) + '月' + parseInt(d[2]) + '日</div>' +
      '<div class="ri-stats">' + (stats.join(' / ') || '—') + '</div>' +
      (r.comment ? '<div style="font-size:12px;color:var(--text);margin-top:2px;">' + r.comment + '</div>' : '') +
      '</div>' +
      '<button class="ri-del" onclick="deleteRecord(\'' + k + '\')">&#x00D7;</button></div>';
  });
  container.innerHTML = html;
}

async function deleteRecord(key) {
  if (!confirm(key + ' の記録を削除しますか？')) return;
  const records = await getRecords(recBird);
  delete records[key];
  await saveRecords(records, recBird);
  await renderRecords();
  if (recBird === activeBird) await checkTodaySaved();
  showToast('削除しました');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
