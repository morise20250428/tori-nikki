<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>とりにっき</title>
<link rel="apple-touch-icon" href="名称未設定のデザイン.png">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #fdf8f0;
    --card: #fff;
    --accent: #e8a87c;
    --accent2: #7ec8b0;
    --text: #3a2f2f;
    --sub: #9e8e8e;
    --border: #f0e8df;
    --nav-h: 64px;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', sans-serif; max-width: 480px; margin: 0 auto; min-height: 100vh; }

  nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: var(--nav-h); background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 100; box-shadow: 0 -2px 12px rgba(0,0,0,.06); }
  nav button { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; color: var(--sub); cursor: pointer; transition: color .2s; padding: 8px 0; }
  nav button.active { color: var(--accent); }
  nav button svg { width: 24px; height: 24px; }

  main { padding: 0 0 calc(var(--nav-h) + 8px); min-height: 100vh; }
  .page { display: none; padding: 0 16px 16px; }
  .page.active { display: block; }

  .header { padding: 20px 0 12px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header .date { font-size: 13px; color: var(--sub); }

  .section-title { font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: .5px; margin: 16px 0 10px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05); margin-bottom: 12px; }

  /* Photo capture - label approach for reliable iOS support */
  .photo-label {
    display: block;
    background: var(--bg);
    border: 2px dashed var(--border);
    border-radius: 12px;
    aspect-ratio: 1;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .photo-label:active { border-color: var(--accent); }
  .photo-label img.preview {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 10px;
  }
  .photo-label .ph-inner {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--sub);
  }
  .photo-label.has-photo .ph-inner {
    background: none;
    justify-content: flex-end;
    padding-bottom: 6px;
  }
  .photo-label.has-photo .ph-inner svg { display: none; }
  .photo-label.has-photo .ph-inner span {
    background: rgba(0,0,0,.38);
    color: #fff;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    backdrop-filter: blur(2px);
  }
  .photo-label input[type=file] { display: none; }

  /* Wide photo (today's one shot) */
  .photo-label-wide {
    display: block;
    background: var(--bg);
    border: 2px dashed var(--border);
    border-radius: 12px;
    width: 100%;
    aspect-ratio: 4/3;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .photo-label-wide:active { border-color: var(--accent); }
  .photo-label-wide img.preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
  .photo-label-wide .ph-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; color: var(--sub); }
  .photo-label-wide.has-photo .ph-inner {
    background: none;
    justify-content: flex-end;
    padding-bottom: 10px;
  }
  .photo-label-wide.has-photo .ph-inner svg { display: none; }
  .photo-label-wide.has-photo .ph-inner span {
    background: rgba(0,0,0,.38);
    color: #fff;
    padding: 3px 12px;
    border-radius: 12px;
    font-size: 11px;
    backdrop-filter: blur(2px);
  }
  .photo-label-wide input[type=file] { display: none; }

  .capture-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

  /* OCR result - always shows editable input */
  .ocr-box { background: var(--bg); border-radius: 10px; padding: 10px 14px; margin-top: 8px; }
  .ocr-box .ocr-label { font-size: 11px; color: var(--sub); margin-bottom: 6px; }
  .ocr-box .ocr-input-row { display: flex; align-items: center; gap: 6px; }
  .ocr-box input.num-input {
    font-size: 28px; font-weight: 700; border: none; background: none;
    width: 100px; outline: none; color: var(--text); border-bottom: 2px solid var(--border);
    padding: 2px 0;
  }
  .ocr-box input.num-input:focus { border-bottom-color: var(--accent); }
  .ocr-box .unit { font-size: 14px; color: var(--sub); }
  .ocr-box .ocr-status { font-size: 11px; color: var(--sub); margin-top: 4px; min-height: 16px; }

  .calc-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: linear-gradient(135deg, #e8f8f3, #d4f0e8); border-radius: 12px; margin-top: 10px; }
  .calc-row .label { font-size: 13px; color: var(--text); }
  .calc-row .value { font-size: 24px; font-weight: 700; color: var(--accent2); }

  .save-btn { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px; transition: opacity .2s; }
  .save-btn:disabled { opacity: .4; cursor: default; }

  .today-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { background: var(--card); border-radius: 14px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .stat-card .s-label { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
  .stat-card .s-val { font-size: 24px; font-weight: 700; }
  .stat-card .s-unit { font-size: 12px; color: var(--sub); }
  .today-photo-thumb { width: 100%; border-radius: 10px; margin-top: 10px; max-height: 160px; object-fit: cover; display: none; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-60px); background: #3a2f2f; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 999; transition: transform .3s ease; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Album */
  .month-group { margin-bottom: 24px; }
  .month-label { font-size: 14px; font-weight: 600; color: var(--sub); margin-bottom: 10px; }
  .album-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .album-thumb { aspect-ratio: 1; border-radius: 8px; overflow: hidden; cursor: pointer; position: relative; background: var(--border); }
  .album-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .album-thumb .thumb-date { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.55)); padding: 10px 4px 4px; font-size: 10px; color: #fff; text-align: center; }
  .album-empty { text-align: center; padding: 60px 20px; color: var(--sub); }
  .album-empty svg { width: 64px; height: 64px; opacity: .3; margin-bottom: 12px; }

  .modal { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.88); align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
  .modal.open { display: flex; }
  .modal img { max-width: 100%; max-height: 72vh; border-radius: 12px; object-fit: contain; }
  .modal-info { color: #fff; margin-top: 12px; text-align: center; }
  .modal-info .mi-date { font-size: 16px; font-weight: 600; }
  .modal-info .mi-stats { font-size: 13px; color: rgba(255,255,255,.7); margin-top: 4px; }
  .modal-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,.15); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .chart-card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05); margin-bottom: 16px; }
  .chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--sub); }
  .chart-wrap { position: relative; height: 180px; }
  .range-btns { display: flex; gap: 6px; margin-bottom: 14px; }
  .range-btns button { flex: 1; padding: 8px; border: 1px solid var(--border); background: var(--card); border-radius: 10px; font-size: 13px; cursor: pointer; color: var(--sub); }
  .range-btns button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .record-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .record-item:last-child { border-bottom: none; }
  .record-item .ri-thumb { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: var(--border); flex-shrink: 0; }
  .record-item .ri-info .ri-date { font-size: 13px; font-weight: 600; }
  .record-item .ri-info .ri-stats { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .record-item .ri-del { margin-left: auto; background: none; border: none; cursor: pointer; color: #ccc; font-size: 20px; padding: 4px 8px; line-height: 1; }
  .no-data { text-align: center; padding: 40px; color: var(--sub); font-size: 14px; }
</style>
</head>
<body>
<main>
  <!-- TODAY PAGE -->
  <div id="page-today" class="page active">
    <div class="header">
      <div>
        <h1>とりにっき</h1>
        <div class="date" id="today-date"></div>
      </div>
    </div>

    <!-- Today saved summary -->
    <div id="today-saved" style="display:none; margin-bottom:16px;">
      <div class="section-title" style="margin-top:0;">今日の記録</div>
      <div class="today-summary">
        <div class="stat-card">
          <div class="s-label">体重</div>
          <div><span class="s-val" id="sum-weight">—</span> <span class="s-unit">g</span></div>
        </div>
        <div class="stat-card">
          <div class="s-label">食べた量</div>
          <div><span class="s-val" id="sum-food">—</span> <span class="s-unit">g</span></div>
        </div>
      </div>
      <img id="sum-photo" class="today-photo-thumb" src="" alt="">
      <div style="margin-top:10px; background:var(--card); border-radius:14px; padding:12px 14px; font-size:13px; color:var(--sub); box-shadow:0 2px 8px rgba(0,0,0,.04);">
        今日はもう記録済みです。下のフォームから上書き保存できます。
      </div>
    </div>

    <!-- Today's one shot -->
    <div class="card">
      <div class="section-title" style="margin-top:0;">今日の一枚</div>
      <label class="photo-label-wide" id="shot-btn" for="shot-input">
        <img class="preview" id="shot-preview" src="" style="display:none;">
        <div class="ph-inner" id="shot-inner">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span>文鳥の写真を撮る</span>
        </div>
        <input type="file" accept="image/*" id="shot-input" onchange="handleShotPhoto(this)">
      </label>
    </div>

    <!-- Weight section -->
    <div class="card">
      <div class="section-title" style="margin-top:0;">体重の記録</div>
      <div class="capture-row">
        <label class="photo-label" id="weight-btn" for="weight-input">
          <img class="preview" id="weight-preview" src="" style="display:none;">
          <div class="ph-inner" id="weight-inner">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>
            <span>体重計の写真</span>
          </div>
          <input type="file" accept="image/*" capture="environment" id="weight-input" onchange="handleScalePhoto('weight', this)">
        </label>
        <div style="display:flex; flex-direction:column; justify-content:center;">
          <div class="ocr-box" id="weight-ocr-box">
            <div class="ocr-label">体重</div>
            <div class="ocr-input-row">
              <input class="num-input" type="number" step="0.1" placeholder="—" id="weight-val" oninput="onNumInput('weight', this.value)">
              <span class="unit">g</span>
            </div>
            <div class="ocr-status" id="weight-status">写真を撮ると自動入力</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Food section -->
    <div class="card">
      <div class="section-title" style="margin-top:0;">餌の記録</div>
      <div class="capture-row">
        <div>
          <label class="photo-label" id="food-before-btn" for="food-before-input">
            <img class="preview" id="food-before-preview" src="" style="display:none;">
            <div class="ph-inner" id="food-before-inner">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>
              <span>与える前</span>
            </div>
            <input type="file" accept="image/*" capture="environment" id="food-before-input" onchange="handleScalePhoto('food-before', this)">
          </label>
          <div class="ocr-box" style="margin-top:8px;">
            <div class="ocr-label">与えた量</div>
            <div class="ocr-input-row">
              <input class="num-input" type="number" step="0.1" placeholder="—" id="food-before-val" oninput="onNumInput('food-before', this.value)">
              <span class="unit">g</span>
            </div>
            <div class="ocr-status" id="food-before-status">写真を撮ると自動入力</div>
          </div>
        </div>
        <div>
          <label class="photo-label" id="food-after-btn" for="food-after-input">
            <img class="preview" id="food-after-preview" src="" style="display:none;">
            <div class="ph-inner" id="food-after-inner">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>
              <span>食べた後</span>
            </div>
            <input type="file" accept="image/*" capture="environment" id="food-after-input" onchange="handleScalePhoto('food-after', this)">
          </label>
          <div class="ocr-box" style="margin-top:8px;">
            <div class="ocr-label">残った量</div>
            <div class="ocr-input-row">
              <input class="num-input" type="number" step="0.1" placeholder="—" id="food-after-val" oninput="onNumInput('food-after', this.value)">
              <span class="unit">g</span>
            </div>
            <div class="ocr-status" id="food-after-status">写真を撮ると自動入力</div>
          </div>
        </div>
      </div>
      <div class="calc-row" id="food-calc" style="display:none;">
        <div class="label">食べた量（計算）</div>
        <div><span class="value" id="food-eaten-val">—</span> <span style="font-size:13px;color:var(--sub);">g</span></div>
      </div>
    </div>

    <button class="save-btn" id="save-btn" onclick="saveRecord()" disabled>記録を保存する</button>
  </div>

  <!-- ALBUM PAGE -->
  <div id="page-album" class="page">
    <div class="header"><h1>アルバム</h1></div>
    <div id="album-content"></div>
  </div>

  <!-- GRAPH PAGE -->
  <div id="page-graph" class="page">
    <div class="header"><h1>グラフ</h1></div>
    <div class="range-btns">
      <button class="active" onclick="setRange(7, this)">7日間</button>
      <button onclick="setRange(14, this)">2週間</button>
      <button onclick="setRange(30, this)">1ヶ月</button>
    </div>
    <div class="chart-card">
      <h3>体重 (g)</h3>
      <div class="chart-wrap"><canvas id="weight-chart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>食べた量 (g)</h3>
      <div class="chart-wrap"><canvas id="food-chart"></canvas></div>
    </div>
  </div>

  <!-- RECORDS PAGE -->
  <div id="page-records" class="page">
    <div class="header"><h1>記録一覧</h1></div>
    <div id="records-list"></div>
  </div>
</main>

<nav>
  <button class="active" onclick="switchPage('today', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M12 14c-5 0-7 2-7 4v1h14v-1c0-2-2-4-7-4z"/></svg>
    今日
  </button>
  <button onclick="switchPage('album', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>
    アルバム
  </button>
  <button onclick="switchPage('graph', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    グラフ
  </button>
  <button onclick="switchPage('records', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    一覧
  </button>
</nav>

<div class="modal" id="photo-modal" onclick="closeModal()">
  <button class="modal-close" onclick="closeModal()">&#x2715;</button>
  <img id="modal-img" src="" alt="">
  <div class="modal-info">
    <div class="mi-date" id="modal-date"></div>
    <div class="mi-stats" id="modal-stats"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== State =====
let state = {
  weight: { value: null, dataUrl: null },
  foodBefore: { value: null, dataUrl: null },
  foodAfter: { value: null, dataUrl: null },
  todayPhoto: null,
};
let chartRange = 7;
let weightChart = null, foodChart = null;

document.addEventListener('DOMContentLoaded', () => {
  updateDateHeader();
  checkTodaySaved();
});

function updateDateHeader() {
  const now = new Date();
  document.getElementById('today-date').textContent =
    now.toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
}

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function checkTodaySaved() {
  const r = getRecords()[todayKey()];
  const el = document.getElementById('today-saved');
  if (r) {
    el.style.display = 'block';
    document.getElementById('sum-weight').textContent = r.weight ?? '—';
    document.getElementById('sum-food').textContent = r.foodEaten ?? '—';
    const ph = document.getElementById('sum-photo');
    if (r.todayPhoto) { ph.src = r.todayPhoto; ph.style.display = 'block'; }
    else { ph.style.display = 'none'; }
  } else {
    el.style.display = 'none';
  }
}

function getRecords() {
  try { return JSON.parse(localStorage.getItem('tori_records') || '{}'); } catch { return {}; }
}
function saveRecords(r) { localStorage.setItem('tori_records', JSON.stringify(r)); }

function switchPage(page, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  btn.classList.add('active');
  if (page === 'album') renderAlbum();
  if (page === 'graph') renderGraphs();
  if (page === 'records') renderRecords();
}

// ===== Today's one shot =====
function handleShotPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  fileToDataUrl(file).then(dataUrl => {
    state.todayPhoto = dataUrl;
    const img = document.getElementById('shot-preview');
    img.src = dataUrl; img.style.display = 'block';
    document.getElementById('shot-btn').classList.add('has-photo');
    document.getElementById('shot-inner').querySelector('span').textContent = '撮り直す';
    updateSaveBtn();
  });
}

// ===== Scale photo + OCR =====
async function handleScalePhoto(type, input) {
  const file = input.files[0];
  if (!file) return;
  const dataUrl = await fileToDataUrl(file);

  const previewId = type === 'weight' ? 'weight' : type === 'food-before' ? 'food-before' : 'food-after';
  showPreview(previewId, dataUrl);

  const statusId = type + '-status';
  const valId = type + '-val';
  document.getElementById(statusId).innerHTML = '<span class="spinner"></span>読み取り中...';

  const val = await ocrNumber(dataUrl);

  if (type === 'weight') state.weight = { value: val, dataUrl };
  else if (type === 'food-before') state.foodBefore = { value: val, dataUrl };
  else state.foodAfter = { value: val, dataUrl };

  const inputEl = document.getElementById(valId);
  if (val !== null) {
    inputEl.value = val;
    document.getElementById(statusId).textContent = '自動読み取り済み（修正できます）';
  } else {
    inputEl.value = '';
    document.getElementById(statusId).textContent = '読み取り失敗。手で入力してください';
  }

  updateFoodCalc();
  updateSaveBtn();
}

function showPreview(prefix, dataUrl) {
  const img = document.getElementById(prefix + '-preview');
  const btn = document.getElementById(prefix + '-btn');
  img.src = dataUrl; img.style.display = 'block';
  btn.classList.add('has-photo');
  const inner = document.getElementById(prefix + '-inner');
  if (inner) inner.querySelector('span').textContent = '撮り直す';
}

function fileToDataUrl(file) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.readAsDataURL(file);
  });
}

function onNumInput(type, val) {
  const num = parseFloat(val);
  const v = isNaN(num) ? null : num;
  if (type === 'weight') state.weight.value = v;
  else if (type === 'food-before') state.foodBefore.value = v;
  else state.foodAfter.value = v;
  updateFoodCalc();
  updateSaveBtn();
}

// ===== OCR with image preprocessing =====
async function ocrNumber(dataUrl) {
  try {
    // Try normal and inverted, pick best result
    const [normal, inverted] = await Promise.all([
      preprocessImage(dataUrl, false),
      preprocessImage(dataUrl, true),
    ]);
    const [r1, r2] = await Promise.all([
      runOcr(normal),
      runOcr(inverted),
    ]);
    // Prefer the one that gave a valid result; if both valid, prefer inverted (LED displays)
    if (r2 !== null) return r2;
    return r1;
  } catch (e) {
    return null;
  }
}

async function runOcr(processedDataUrl) {
  try {
    const result = await Tesseract.recognize(processedDataUrl, 'eng', {
      tessedit_char_whitelist: '0123456789.',
      tessedit_pageseg_mode: '7',
    });
    const text = result.data.text.replace(/[^\d.]/g, '');
    const matches = text.match(/\d+\.?\d*/g);
    if (!matches || matches.length === 0) return null;
    const best = matches.reduce((a, b) => b.replace('.','').length > a.replace('.','').length ? b : a);
    let num = parseFloat(best);
    if (isNaN(num) || num <= 0) return null;
    // LED scale: decimal point (or colon) often lost in binarization
    // e.g. "2358" should be 23.58, "1419" should be 14.19
    if (num > 100 && num < 10000 && !best.includes('.') && best.length >= 3) {
      const candidate = parseFloat(best.slice(0, -2) + '.' + best.slice(-2));
      if (candidate > 0 && candidate <= 200) num = candidate;
    }
    if (num <= 0 || num > 500) return null;
    return Math.round(num * 100) / 100;
  } catch (e) {
    return null;
  }
}

function preprocessImage(dataUrl, invert) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      // Keep size reasonable for speed
      const maxSize = 600;
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imageData.data;
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        const v = invert ? (gray < 128 ? 255 : 0) : (gray > 128 ? 255 : 0);
        d[i] = d[i+1] = d[i+2] = v;
      }
      ctx.putImageData(imageData, 0, 0);
      resolve(canvas.toDataURL('image/png'));
    };
    img.src = dataUrl;
  });
}

// ===== Food calc =====
function updateFoodCalc() {
  const b = state.foodBefore.value, a = state.foodAfter.value;
  const calc = document.getElementById('food-calc');
  if (b !== null && a !== null) {
    const eaten = Math.max(0, Math.round((b - a) * 10) / 10);
    document.getElementById('food-eaten-val').textContent = eaten;
    calc.style.display = 'flex';
  } else {
    calc.style.display = 'none';
  }
}

function getEaten() {
  const b = state.foodBefore.value, a = state.foodAfter.value;
  if (b === null || a === null) return null;
  return Math.max(0, Math.round((b - a) * 10) / 10);
}

function updateSaveBtn() {
  const btn = document.getElementById('save-btn');
  btn.disabled = !(
    state.weight.value !== null || state.weight.dataUrl !== null ||
    state.foodBefore.dataUrl !== null || state.foodAfter.dataUrl !== null ||
    getEaten() !== null || state.todayPhoto !== null
  );
}

// ===== Save =====
function saveRecord() {
  const key = todayKey();
  const records = getRecords();
  records[key] = {
    date: key,
    weight: state.weight.value,
    foodBefore: state.foodBefore.value,
    foodAfter: state.foodAfter.value,
    foodEaten: getEaten(),
    todayPhoto: state.todayPhoto,
    photos: {
      weight: state.weight.dataUrl || null,
      foodBefore: state.foodBefore.dataUrl || null,
      foodAfter: state.foodAfter.dataUrl || null,
    },
    savedAt: new Date().toISOString(),
  };
  saveRecords(records);
  showToast('保存しました！');
  checkTodaySaved();
  // Restore state from saved record so form stays functional for overwrites
  const saved = records[key];
  state = {
    weight: { value: saved.weight, dataUrl: saved.photos.weight },
    foodBefore: { value: saved.foodBefore, dataUrl: saved.photos.foodBefore },
    foodAfter: { value: saved.foodAfter, dataUrl: saved.photos.foodAfter },
    todayPhoto: saved.todayPhoto,
  };
  updateSaveBtn();
}

// ===== Album (今日の一枚のみ) =====
function renderAlbum() {
  const records = getRecords();
  const keys = Object.keys(records).filter(k => records[k].todayPhoto).sort().reverse();
  const container = document.getElementById('album-content');

  if (keys.length === 0) {
    container.innerHTML =
      '<div class="album-empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>' +
      '<div>まだ写真がありません</div>' +
      '<div style="font-size:12px;margin-top:6px;">「今日の一枚」で文鳥ちゃんを撮ってね</div></div>';
    return;
  }

  const months = {};
  keys.forEach(k => {
    const m = k.slice(0, 7);
    if (!months[m]) months[m] = [];
    months[m].push(k);
  });

  let html = '';
  Object.keys(months).sort().reverse().forEach(m => {
    const [y, mo] = m.split('-');
    html += '<div class="month-group"><div class="month-label">' + y + '年' + parseInt(mo) + '月</div><div class="album-grid">';
    months[m].forEach(k => {
      const d = k.split('-');
      html += '<div class="album-thumb" onclick="openModal(\'' + k + '\')">' +
        '<img src="' + records[k].todayPhoto + '" loading="lazy">' +
        '<div class="thumb-date">' + parseInt(d[1]) + '/' + parseInt(d[2]) + '</div>' +
        '</div>';
    });
    html += '</div></div>';
  });
  container.innerHTML = html;
}

function openModal(key) {
  const r = getRecords()[key];
  if (!r) return;
  document.getElementById('modal-img').src = r.todayPhoto || '';
  const d = key.split('-');
  document.getElementById('modal-date').textContent = d[0] + '年' + parseInt(d[1]) + '月' + parseInt(d[2]) + '日';
  const stats = [];
  if (r.weight != null) stats.push('体重 ' + r.weight + 'g');
  if (r.foodEaten != null) stats.push('食べた ' + r.foodEaten + 'g');
  document.getElementById('modal-stats').textContent = stats.join('　');
  document.getElementById('photo-modal').classList.add('open');
}

function closeModal() { document.getElementById('photo-modal').classList.remove('open'); }

// ===== Graph =====
function setRange(days, btn) {
  chartRange = days;
  document.querySelectorAll('.range-btns button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGraphs();
}

function renderGraphs() {
  const records = getRecords();
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - chartRange + 1);
  const keys = Object.keys(records).sort().filter(k => new Date(k) >= cutoff);
  const labels = keys.map(k => { const d=k.split('-'); return parseInt(d[1])+'/'+parseInt(d[2]); });
  if (weightChart) weightChart.destroy();
  if (foodChart) foodChart.destroy();
  weightChart = makeChart('weight-chart', labels, keys.map(k => records[k].weight), '#e8a87c');
  foodChart = makeChart('food-chart', labels, keys.map(k => records[k].foodEaten), '#7ec8b0');
}

function makeChart(id, labels, data, color) {
  return new Chart(document.getElementById(id).getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [{ data, borderColor: color, backgroundColor: color+'33', fill: true, tension: 0.4, pointRadius: 5, pointBackgroundColor: color, spanGaps: false }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { grid: { display: false }, ticks: { font: { size: 11 } } }, y: { grid: { color: '#f0e8df' }, ticks: { font: { size: 11 } } } } }
  });
}

// ===== Records =====
function renderRecords() {
  const records = getRecords();
  const keys = Object.keys(records).sort().reverse();
  const container = document.getElementById('records-list');
  if (keys.length === 0) { container.innerHTML = '<div class="no-data">まだ記録がありません</div>'; return; }
  let html = '';
  keys.forEach(k => {
    const r = records[k];
    const thumb = r.todayPhoto || r.photos?.weight || r.photos?.foodBefore;
    const d = k.split('-');
    const stats = [];
    if (r.weight != null) stats.push('体重 ' + r.weight + 'g');
    if (r.foodEaten != null) stats.push('食べた ' + r.foodEaten + 'g');
    html += '<div class="record-item">' +
      (thumb ? '<img class="ri-thumb" src="' + thumb + '">' : '<div class="ri-thumb"></div>') +
      '<div class="ri-info"><div class="ri-date">' + d[0] + '年' + parseInt(d[1]) + '月' + parseInt(d[2]) + '日</div>' +
      '<div class="ri-stats">' + (stats.join(' / ') || '—') + '</div></div>' +
      '<button class="ri-del" onclick="deleteRecord(\'' + k + '\')">&#x00D7;</button></div>';
  });
  container.innerHTML = html;
}

function deleteRecord(key) {
  if (!confirm(key + ' の記録を削除しますか？')) return;
  const records = getRecords();
  delete records[key];
  saveRecords(records);
  renderRecords();
  checkTodaySaved();
  showToast('削除しました');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
